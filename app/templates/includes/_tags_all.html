<!-- Tags Grouped by Status Widget -->
<div class="bg-white rounded-lg shadow border p-4 flex flex-col w-full h-[75vh]" x-data="tagDetailsTable()">
  <div class="justify-between flex items-center mb-4 flex-shrink-0">
   

    <label class="flex items-center gap-2 text-sm text-gray-600">
      <span>Limite</span>
      <select x-model="selectedLimit" @change="onLimitChange()"
        class="rounded border border-gray-300 bg-white px-2 py-1 text-sm text-gray-900">
        <option value="50">50</option>
        <option value="100">100</option>
        <option value="200">200</option>
        <option value="all">Todos</option>
      </select>
    </label>
  </div>

  <div class="flex-1 grid grid-cols-1 md:grid-cols-3 gap-4">
    <!-- Coluna: IN -->
    <div class="border rounded h-full flex flex-col">
      <div class="bg-green-100 text-green-800 font-semibold text-center py-2">Dentro (IN)</div>
      <div class="overflow-y-auto flex-1">
        <template x-for="tag in tagsIn" :key="tag.epc">
          <div class="border-b px-2 py-2 flex flex-col text-xs font-mono">
            <span><b>EPC:</b> <span x-text="tag.epc"></span></span>
            <span><b>Ant:</b> <span x-text="tag.ant"></span></span>
            <span><b>Status:</b> <span x-text="tag.passed"></span></span>
          </div>
        </template>
        <div x-show="tagsIn.length === 0" class="p-4 text-center text-gray-400">Nenhuma tag</div>
      </div>
    </div>

    <!-- Coluna: OUT -->
    <div class="border rounded h-full flex flex-col">
      <div class="bg-red-100 text-red-800 font-semibold text-center py-2">Fora (OUT)</div>
      <div class="overflow-y-auto flex-1">
        <template x-for="tag in tagsOut" :key="tag.epc">
          <div class="border-b px-2 py-2 flex flex-col text-xs font-mono">
            <span><b>EPC:</b> <span x-text="tag.epc"></span></span>
            <span><b>Ant:</b> <span x-text="tag.ant"></span></span>
            <span><b>Status:</b> <span x-text="tag.passed"></span></span>
          </div>
        </template>
        <div x-show="tagsOut.length === 0" class="p-4 text-center text-gray-400">Nenhuma tag</div>
      </div>
    </div>

    <!-- Coluna: Outros -->
    <div class="border rounded h-full flex flex-col">
      <div class="bg-gray-100 text-gray-800 font-semibold text-center py-2">Outros</div>
      <div class="overflow-y-auto flex-1">
        <template x-for="tag in tagsOther" :key="tag.epc">
          <div class="border-b px-2 py-2 flex flex-col text-xs font-mono">
            <span><b>EPC:</b> <span x-text="tag.epc"></span></span>
            <span><b>Ant:</b> <span x-text="tag.ant"></span></span>
            <span><b>Status:</b> <span x-text="tag.passed"></span></span>
          </div>
        </template>
        <div x-show="tagsOther.length === 0" class="p-4 text-center text-gray-400">Nenhuma tag</div>
      </div>
    </div>
  </div>
</div>

<script>
  function tagDetailsTable() {
    return {
      tags: [],
      tagsIn: [],
      tagsOut: [],
      tagsOther: [],
      loadingTags: false,
      pollHandle: null,
      visibilityHandler: null,
      lastTagsPayload: "",
      selectedLimit: "50",

      async init() {
        await this.loadTags();
        TemplateUtils.bindVisibilityPolling(this, this.loadTags, 2000);
      },

      destroy() {
        TemplateUtils.unbindVisibilityPolling(this);
      },

      getTagsUrl() {
        if (this.selectedLimit === "all") {
          return "{{ url_for('get_tags') }}";
        }
        return "{{ url_for('get_n_tags', limit=999999) }}".replace(
          "999999",
          this.selectedLimit,
        );
      },

      async onLimitChange() {
        this.lastTagsPayload = "";
        await this.loadTags();
      },

      async loadTags() {
        if (this.loadingTags) {
          return;
        }
        this.loadingTags = true;
        try {
          const result = await TemplateUtils.fetchJsonIfChanged(
            this.getTagsUrl(),
            this.lastTagsPayload,
          );
          if (result.changed) {
            this.lastTagsPayload = result.payload;
            const data = result.data;
            this.tags = Array.isArray(data) ? data : data.tags || [];
            // Agrupar tags por status
            this.tagsIn = this.tags.filter(t => t.passed === 'in');
            this.tagsOut = this.tags.filter(t => t.passed === 'out');
            this.tagsOther = this.tags.filter(t => t.passed !== 'in' && t.passed !== 'out');
          }
        } catch (error) {
          console.error("Erro ao carregar tags:", error);
        } finally {
          this.loadingTags = false;
        }
      },
    };
  }
</script>
